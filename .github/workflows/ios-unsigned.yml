name: Build Unsigned TrendRadar IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "260821-feat-ios-pure-mobile"
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA for sideloading
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate iOS project inputs
        working-directory: ios
        run: |
          test -f project.yml
          test -f TrendRadar/Resources/Info.plist
          test -d TrendRadar

      - name: Build unsigned app
        working-directory: ios
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project TrendRadar.xcodeproj \
            -scheme TrendRadar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        run: |
          {
            echo "## Xcode build errors"
            echo '```text'
            grep -E "error:|fatal error:" build/xcodebuild.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-iOS-build-log
          path: ios/build/xcodebuild.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/TrendRadar.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"
          test -x "$APP_PATH/TrendRadar"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/TrendRadar.app
          cd build
          /usr/bin/zip -qry TrendRadar-unsigned.ipa Payload
          unzip -t TrendRadar-unsigned.ipa >/dev/null
          unzip -Z1 TrendRadar-unsigned.ipa | grep -Fx "Payload/TrendRadar.app/Info.plist"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-iOS-unsigned
          path: ios/build/TrendRadar-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA on packaging failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-iOS-packaging-debug
          path: ios/build/TrendRadar-unsigned.ipa
          if-no-files-found: warn
