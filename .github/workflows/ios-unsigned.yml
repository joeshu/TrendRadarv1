name: Build Unsigned TrendRadar IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "260821-feat-ios-pure-mobile"
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA for sideloading
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate iOS project inputs
        working-directory: ios
        run: |
          test -f project.yml
          test -f TrendRadar/Resources/Info.plist
          test -f TrendRadar/Resources/TrendRadar.entitlements
          test -d TrendRadar
          /usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers:0' TrendRadar/Resources/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' TrendRadar/Resources/Info.plist

      - name: Run Swift unit tests
        working-directory: ios
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project TrendRadar.xcodeproj \
            -scheme TrendRadar \
            -sdk iphonesimulator \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build/test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-iOS-test-log
          path: ios/build/test.log
          if-no-files-found: warn

      - name: Build unsigned app
        working-directory: ios
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project TrendRadar.xcodeproj \
            -scheme TrendRadar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        run: |
          {
            echo "## Xcode build errors"
            echo '```text'
            grep -E "error:|fatal error:" build/xcodebuild.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-iOS-build-log
          path: ios/build/xcodebuild.log
          if-no-files-found: warn

      - name: Package raw and ad-hoc IPA
        working-directory: ios
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/TrendRadar.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          test -x "$APP_PATH/$EXECUTABLE"

          rm -rf build/raw build/adhoc
          mkdir -p build/raw/Payload build/adhoc/Payload
          cp -R "$APP_PATH" build/raw/Payload/TrendRadar.app
          cp -R "$APP_PATH" build/adhoc/Payload/TrendRadar.app

          # A completely unsigned executable is terminated by stock iOS unless the
          # installer re-signs it. The ad-hoc variant is suitable for environments
          # such as TrollStore/CoreTrust bypass; AltStore-style tools should use
          # either IPA and apply their own development signature.
          /usr/bin/codesign --force --sign - --timestamp=none \
            --entitlements TrendRadar/Resources/TrendRadar.entitlements \
            build/adhoc/Payload/TrendRadar.app
          /usr/bin/codesign --verify --deep --strict --verbose=2 build/adhoc/Payload/TrendRadar.app

          (cd build/raw && /usr/bin/zip -qry ../TrendRadar-unsigned.ipa Payload)
          (cd build/adhoc && /usr/bin/zip -qry ../TrendRadar-adhoc.ipa Payload)
          for ipa in build/TrendRadar-unsigned.ipa build/TrendRadar-adhoc.ipa; do
            unzip -t "$ipa" >/dev/null
            unzip -Z1 "$ipa" | grep -Fx "Payload/TrendRadar.app/Info.plist"
          done
          shasum -a 256 build/TrendRadar-*.ipa | tee build/SHA256SUMS.txt

      - name: Upload sideloading IPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-iOS-sideload
          path: |
            ios/build/TrendRadar-unsigned.ipa
            ios/build/TrendRadar-adhoc.ipa
            ios/build/SHA256SUMS.txt
            ios/INSTALL.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA on packaging failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-iOS-packaging-debug
          path: |
            ios/build/TrendRadar-unsigned.ipa
            ios/build/TrendRadar-adhoc.ipa
          if-no-files-found: warn
