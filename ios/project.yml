name: TrendRadar
options:
  bundleIdPrefix: com.trendradar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  TrendRadar:
    type: application
    platform: iOS
    sources:
      - path: TrendRadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trendradar.mobile
        INFOPLIST_FILE: TrendRadar/Resources/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: TrendRadar/Resources/TrendRadar.entitlements
    resources:
      - path: ../config/ai_analysis_prompt.txt
      - path: ../config/ai_filter/prompt.txt
      - path: ../config/ai_filter/extract_prompt.txt
      - path: ../config/ai_filter/update_tags_prompt.txt
    scheme:
      gatherCoverageData: true
      testTargets:
        - TrendRadarTests
  TrendRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TrendRadar
